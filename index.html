<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sable Landing Page</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navigation -->
  <header class="site-header">
    <div class="nav-inner">
      <div class="logo">Sable.</div>
      <nav class="nav-links">
        <a href="#">CREDIT</a>
        <a href="#">DEBIT</a>
        <a href="#">APP</a>
        <a href="#">LEARN</a>
      </nav>
    
</header>

  <!-- Hero Section -->
  <section class="hero-layer">
    <!-- White bar top-right -->
    <div class="white-bar"></div>
    <div class="hero-overlay">
      <!-- Top card centered -->
      <img src="assests/images/card-top.png" alt="Top Card" class="card-top" />

      <!-- Text block -->
      <div class="hero-content">
        <p class="hero-line">The fastest,</p>
        <p class="hero-line">most premium path to</p>
        <h1 class="hero-bold">financial freedom</h1>
        <a href="#benefits" class="btn-explore">Explore</a>
      </div>

      <!-- Bottom card -->
      <img src="assests/images/card-bottom.png" alt="Bottom Card" class="card-bottom" />

      <!-- FDIC icon -->
      <img src="assests/icons/fdic-icon.png" alt="FDIC Icon" class="fdic-corner" />
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
